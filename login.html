<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Star Rewards</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body class="login-body">

  <main class="login-container">
    <div class="login-card">
      <div class="login-brand">⭐ Star Rewards</div>
      <p class="login-subtitle">Teacher Login</p>

      <form id="login-form" novalidate>
        <label class="form-label" for="email-input">Email</label>
        <input type="email" id="email-input" class="form-input" required autocomplete="username" />

        <label class="form-label" for="password-input">Password</label>
        <input type="password" id="password-input" class="form-input" required autocomplete="current-password" />

        <p class="login-error" id="login-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
          Log In
        </button>
      </form>

      <p class="text-muted" style="text-align: center; margin-top: var(--space-md); font-size: var(--font-size-sm);">
        Need an account? <a href="signup.html" style="color: var(--color-primary); font-weight: 600;">Sign up</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { loginTeacher, redirectIfLoggedIn } from "./js/auth.js";

    redirectIfLoggedIn();

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";

      try {
        await loginTeacher(email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = "Incorrect email or password. Please try again.";
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>

</body>
</html>
