<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Star Rewards</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body class="login-body">

  <main class="login-container">
    <div class="login-card">
      <div class="login-brand">⭐ Star Rewards</div>
      <p class="login-subtitle">Teacher Sign Up</p>

      <form id="signup-form" novalidate>
        <label class="form-label" for="name-input">Full Name</label>
        <input type="text" id="name-input" class="form-input" required autocomplete="name" />

        <label class="form-label" for="email-input">Email</label>
        <input type="email" id="email-input" class="form-input" required autocomplete="username" />

        <label class="form-label" for="password-input">Password</label>
        <input type="password" id="password-input" class="form-input" required autocomplete="new-password" minlength="6" />

        <p class="login-error" id="signup-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-full" id="signup-submit-btn">
          Sign Up
        </button>
      </form>

      <p class="text-muted" style="text-align: center; margin-top: var(--space-md); font-size: var(--font-size-sm);">
        Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Log in</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { signUpTeacher, redirectIfLoggedIn } from "./js/auth.js";

    redirectIfLoggedIn();

    const form = document.getElementById("signup-form");
    const errorEl = document.getElementById("signup-error");
    const submitBtn = document.getElementById("signup-submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const name = document.getElementById("name-input").value.trim();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;

      if (!name) {
        errorEl.textContent = "Please enter your name.";
        errorEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";

      try {
        await signUpTeacher(name, email, password);
        window.location.href = "pending.html";
      } catch (err) {
        errorEl.textContent = err.code === "auth/email-already-in-use"
          ? "An account with this email already exists."
          : err.code === "auth/weak-password"
          ? "Password must be at least 6 characters."
          : "Something went wrong. Please try again.";
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
      }
    });
  </script>

</body>
</html>
